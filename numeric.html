<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Numeric · Little Counter</title><link rel="stylesheet" href="style.css"><script src="counter.js" defer></script></head>
<body data-mode="numeric"><main><a class="back" href="index.html">← Home</a><p class="eyebrow">LITTLE COUNTER</p><h1>Numeric<span>.</span></h1><p class="intro">Every little step counts.</p><section class="counter" aria-label="Number counter"><output id="value" aria-live="polite" aria-atomic="true">0</output><p id="hint">Start at zero. Count your way up.</p></section><div class="controls"><button id="plus" aria-label="Increase number">+</button><button id="minus" aria-label="Decrease number">−</button><button id="reset">Reset</button></div><p class="footnote">Tap + to go forward, − to go back.</p></main></body></html>
